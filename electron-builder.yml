appId: com.skills-manager.app
productName: Skills Manager
directories:
  output: dist
files:
  - out/**/*
extraResources:
  - from: dist-cli/
    to: cli/
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [arm64]
  extendInfo:
    LSEnvironment:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin
