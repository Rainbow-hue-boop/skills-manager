appId: com.skills-manager.app
productName: Skills Manager
directories:
  output: dist
files:
  - out/**/*
extraResources:
  - from: cli/
    to: cli/
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  extendInfo:
    LSEnvironment:
      PATH: /usr/local/bin:/usr/bin:/bin
